# Keeps the free-tier Supabase project awake.
#
# Supabase pauses free projects after 7 days without API activity, and a paused
# project's hostname disappears from DNS — the game then fails with
# ERR_NAME_NOT_RESOLVED and online battles are impossible until someone
# restores it by hand. A tiny authenticated request every 3 days counts as
# activity and prevents the pause. The anon key below is the public,
# client-side key that already ships in the app bundle.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *'   # every 3 days at 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the project's REST endpoint
        env:
          SUPABASE_URL: https://iyceaspukufevktabmvy.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml5Y2Vhc3B1a3VmZXZrdGFibXZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2NjU3NTIsImV4cCI6MjA5OTI0MTc1Mn0.btg1ezB0lVHzsZFOf59W6CwN12xm6Adwh6f6BdWW9L4
        run: |
          set -e
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
          echo "REST responded with HTTP $code"
          # Any HTTP answer means the project is awake; DNS/connection failure means it is paused.
          test "$code" != "000"
